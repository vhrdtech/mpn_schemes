[package]
name = "mpn_schemes"
description = "Manufacturer part-number schemes as data: decode an MPN into parameters, craft MPNs for wanted parameters"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"
include = ["src/**/*.rs", "build.rs", "../schemes/**/*.toml", "Cargo.toml"]

[dependencies]
serde = { version = "1", default-features = false, features = ["std", "derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
serde_json = { version = "1", default-features = false, features = ["std"] }
