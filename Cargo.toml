[workspace.package]
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
edition = "2024"
version = "0.1.4"
license = "MIT"
repository = "https://github.com/vhrdtech/mpn_schemes"

[workspace]
resolver = "3"
members = ["mpn_schemes", "mpn_schemes_cli"]

[workspace.dependencies]
mpn_schemes = { path = "mpn_schemes", version = "0.1.4" }

[profile.dev]
split-debuginfo = "unpacked"

[profile.test]
split-debuginfo = "unpacked"

# just install: release, but incremental so a rebuild after a small change is quick
[profile.deploy]
inherits = "release"
incremental = true
