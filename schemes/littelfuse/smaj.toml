# Littelfuse SMAJ series, 400 W surface-mount TVS diodes in DO-214AC: the number is the reverse stand-off voltage
# VRWM (not the breakdown voltage, which the data sheet gives separately per part), written with one decimal place
# below 10 V and as a plain integer from 10 V up (so it is one table rather than a code: no kind here can switch
# format by magnitude the way this maker's text does). Every one of the 55 stand-off voltages (5 V to 440 V) is
# offered both unidirectional (A, 5% tolerance) and bidirectional (CA); the numbering system's own diagram also
# allows a bare 10%-tolerance part (no A) and a bidirectional-only 10% part (C without A), so both letters are
# modelled as independently optional even though this data sheet's own table only lists the 5%-tolerance forms.
# The SMBJ (600 W, DO-214AB) and SMCJ (1500 W, DO-214AA) series share this exact numbering but have their own,
# wider voltage tables; left out until their own data sheets are read. The "-E"/"-E1" Ex-China origin suffix is
# left out too (not an electrical parameter).
[scheme]
id = "littelfuse.smaj"
version = 1
maker = "Littelfuse"
class = "diode.tvs"
title = "Littelfuse SMAJ series, 400 W surface-mount TVS diodes"
sources = [
  { doc = "SMAJ Series, Surface Mount - 400W TVS Diodes Datasheet", url = "https://www.littelfuse.com/assetdocs/tvs-diodes-smaj-datasheet?assetguid=13c2a823-03b8-4d1f-9ddc-9b44670aed9d", fetched = "2026-11-10", pages = "2,14" },
]

[implies]
package = "do214ac"

[[segment]]
name = "series"
literal = "SMAJ"

[[segment]]
name = "voltage"
param = "standoff_voltage"
table = { "5.0" = "5V", "6.0" = "6V", "6.5" = "6.5V", "7.0" = "7V", "7.5" = "7.5V", "8.0" = "8V", "8.5" = "8.5V", "9.0" = "9V", "10" = "10V", "11" = "11V", "12" = "12V", "13" = "13V", "14" = "14V", "15" = "15V", "16" = "16V", "17" = "17V", "18" = "18V", "20" = "20V", "22" = "22V", "24" = "24V", "26" = "26V", "28" = "28V", "30" = "30V", "33" = "33V", "36" = "36V", "40" = "40V", "43" = "43V", "45" = "45V", "48" = "48V", "51" = "51V", "54" = "54V", "58" = "58V", "60" = "60V", "64" = "64V", "70" = "70V", "75" = "75V", "78" = "78V", "85" = "85V", "90" = "90V", "100" = "100V", "110" = "110V", "120" = "120V", "130" = "130V", "150" = "150V", "160" = "160V", "170" = "170V", "180" = "180V", "188" = "188V", "200" = "200V", "220" = "220V", "250" = "250V", "300" = "300V", "350" = "350V", "400" = "400V", "440" = "440V" }

[[segment]]
name = "bidirectional"
param = "bidirectional"
optional = true
absent = "no"
table = { C = "yes" }

[[segment]]
name = "tolerance"
param = "tolerance"
optional = true
absent = "±10%"
table = { A = "±5%" }

[[example]]
mpn = "SMAJ5.0A"
params = { standoff_voltage = "5V", bidirectional = "no", tolerance = "±5%" }
source = "data sheet p. 2, electrical characteristics"

[[example]]
mpn = "SMAJ5.0CA"
params = { standoff_voltage = "5V", bidirectional = "yes", tolerance = "±5%" }
source = "data sheet p. 2, electrical characteristics"

[[example]]
mpn = "SMAJ58CA"
params = { standoff_voltage = "58V", bidirectional = "yes", tolerance = "±5%" }
source = "mx3 corpus (real lab part, 10 Nov 2026); data sheet p. 2 row for 58 V"

[[example]]
mpn = "SMAJ440A"
params = { standoff_voltage = "440V", bidirectional = "no", tolerance = "±5%" }
source = "data sheet p. 3, electrical characteristics"
