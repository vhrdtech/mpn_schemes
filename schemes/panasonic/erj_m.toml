# Panasonic ERJ-M1W current sensing resistors, metal plate type: General type (S, standard electrode) and Wide
# terminal type (T), both 2512. Not recommended for new design (replaced by ERJ-MS4/MS6); documented anyway, the
# same way erj_g keeps its own not-recommended sizes. The low-ohm ERJM03 (0603, discontinued) has a similar but
# not identical numbering (its "type" position is N for general type only) and is not covered here.
# T.C.R. is in the ratings table but is not uniform across the family (it depends on both type and resistance
# value), so it is left undecoded here rather than guessed, the same reasoning as erj_precision's ±1 % series.
# Panasonic writes the part numbers without a dash (ERJM1WSF3M0U); distributors write ERJ-M1WSF3M0U.
[scheme]
id = "panasonic.erj_m"
version = 1
maker = "Panasonic"
aliases = ["Panasonic Industry", "Panasonic Electronic Components", "Matsushita"]
class = "resistor.chip"
title = "Panasonic ERJ-M1W current sensing resistors, metal plate type"
sources = [
  { doc = "Panasonic Current Sensing Resistors, Metal Plate Type, Series: ERJ M1W (AOA0000C323, 1-Apr-21)", url = "https://industrial.panasonic.com/cdbs/www-data/pdf/RDN0000/AOA0000C323.pdf", fetched = "2026-11-10", pages = "1-2" },
]
availability = "closed"
min_stem = "size"

[implies]
technology = "metal_film"

[[segment]]
name = "maker"
literal = "ERJ"

[[segment]]
name = "dash"
literal = "-"
optional = true

[[segment]]
name = "plate"
literal = "M"

[[segment]]
name = "size"
param = "case_eia"
table = { "1W" = "2512" }

[[segment]]
name = "type"
note = "electrode construction, not decoded as a parameter: S general type (standard electrode), T wide terminal type; each offers its own set of standard resistance values (Ratings, p. 1)"
table = { S = "general type, standard electrode", T = "wide terminal type" }

[[segment]]
name = "tolerance"
param = "tolerance"
table = { F = "±1%", J = "±5%" }

[[segment]]
name = "resistance"
param = "resistance"
code = "rkm"
digits = 3
unit = "mΩ"
letters = { M = 0 }

[[segment]]
name = "packaging"
param = "packaging"
table = { U = "reel_7in_embossed" }

[[available]]
size = "2512"
type = { code = "S" }
resistance = ["3mΩ", "4mΩ", "5mΩ", "6mΩ", "10mΩ", "15mΩ", "20mΩ"]

[[available]]
size = "2512"
type = { code = "T" }
resistance = ["1mΩ", "1.5mΩ", "2mΩ", "3mΩ", "4mΩ"]

[[example]]
mpn = "ERJM1WSF3M0U"
params = { case_eia = "2512", tolerance = "±1%", resistance = "3mΩ", packaging = "reel_7in_embossed" }
source = "data sheet p. 1, explanation of part numbers"

[[example]]
mpn = "ERJM1WTF1M0U"
params = { case_eia = "2512", tolerance = "±1%", resistance = "1mΩ", packaging = "reel_7in_embossed" }
source = "distributor listing (datasheets.com, 10 Nov 2026)"
