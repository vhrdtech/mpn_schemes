# Yageo RC_L / RC_P: general purpose thick-film chip resistors, 0100 to 2512. RC_P is the same series under a
# total-lead-free, no-RoHS-exemption spec sheet; it differs from RC_L only in the final default code (P vs L).
# Not covered yet (DATA-2): jumpers ordered with tolerance F (RC0402FR-070RL is listed at Digi-Key; the data sheet
# says J), RC0075 (ESD-safe reel only), the ESD-safe reel S/7N, and the reel codes 7W/3W
# (2x standard power) and 7D (2x standard quantity), which mean a different power or reel quantity that no
# segment can carry beside the packaging.
[scheme]
id = "yageo.rc"
version = 2
maker = "YAGEO"
aliases = ["Yageo Corporation", "Phycomp"]
class = "resistor.chip"
title = "Yageo RC_L / RC_P general purpose chip resistors"
sources = [
  { doc = "Yageo data sheet: General purpose chip resistors RC_L series, product specification V.14 (14 Nov 2025)", url = "https://www.yageogroup.com/content/datasheet/asset/file/PYU-RC_GROUP_51_ROHS_L", fetched = "2026-11-10", pages = "2, 4-7" },
  { doc = "Yageo data sheet: Lead free chip resistors RC_P series, product specification V.6 (26 Dec 2024)", url = "https://www.mouser.com/datasheet/2/447/pyu_rc_51_rohs_p-3370815.pdf", fetched = "2026-11-10", pages = "2" },
]
availability = "closed"
min_stem = "size"

[implies]
technology = "thick_film"

[[segment]]
name = "series"
literal = "RC"

[[segment]]
name = "size"
param = "case_eia"
note = "p. 2 (1)"
table = { "0100" = "01005", "0201" = "0201", "0402" = "0402", "0603" = "0603", "0805" = "0805", "1206" = "1206", "1210" = "1210", "1218" = "1218", "2010" = "2010", "2512" = "2512" }

[[segment]]
name = "value"
note = "p. 2: (2) tolerance, (3)-(5) packing, (6) resistance; a jumper is ordered with tolerance code J and 0R and has no tolerance"
[[segment.alternatives]]
group = [
  { name = "tolerance", param = "tolerance", table = { B = "±0.1%", D = "±0.5%", F = "±1%", J = "±5%" } },
  { name = "packing", param = "packaging", table = { "R-07" = { value = "reel_7in_paper", default = true }, "R-10" = "reel_10in_paper", "R-13" = "reel_13in_paper", "K-07" = "reel_7in_embossed", "K-13" = "reel_13in_embossed" } },
  { name = "resistance", param = "resistance", code = "rkm", series = ["E24", "E96"] },
]
[[segment.alternatives]]
group = [
  { name = "jumper", literal = "J" },
  { name = "packing", param = "packaging", table = { "R-07" = { value = "reel_7in_paper", default = true }, "R-10" = "reel_10in_paper", "R-13" = "reel_13in_paper", "K-07" = "reel_7in_embossed", "K-13" = "reel_13in_embossed" } },
  { name = "resistance", param = "resistance", table = { "0R" = "0Ω" } },
]

[[segment]]
name = "default"
param = "series"
note = "p. 2 (7): L is the system default code for ordering (RC_L, PYU-RC_GROUP_51_ROHS_L); P is the same series under a total-lead-free, no-RoHS-exemption spec sheet (RC_P, PYU-RC_51_ROHS_P, V.6)"
table = { L = "RC_L", P = "RC_P" }

# Resistance ranges per size and tolerance, Table 2 and 3 (pp. 4-6), standard power. ±5 % is E24, the others
# E24/E96. The 10 % and 20 % grades of RC0805/RC1206 have no tolerance code in the ordering information.

[[available]]
size = ["0201", "0402", "0805", "1206"]
tolerance = "±5%"
resistance = { min = "1Ω", max = "100MΩ", series = "E24" }

[[available]]
size = ["01005", "0603", "1210", "2010", "2512"]
tolerance = "±5%"
resistance = { min = "1Ω", max = "22MΩ", series = "E24" }

[[available]]
size = "1218"
tolerance = "±5%"
resistance = { min = "1Ω", max = "1MΩ", series = "E24" }

[[available]]
size = ["01005", "0201", "0402", "0603", "0805", "1206", "1210", "2010", "2512"]
tolerance = "±1%"
resistance = { min = "1Ω", max = "10MΩ" }

[[available]]
size = "1218"
tolerance = "±1%"
resistance = { min = "1Ω", max = "1MΩ" }

[[available]]
size = "01005"
tolerance = "±0.5%"
resistance = { min = "33Ω", max = "470kΩ" }

[[available]]
size = ["0201", "0402", "0603", "0805", "1206"]
tolerance = "±0.5%"
resistance = { min = "1Ω", max = "1MΩ" }

[[available]]
size = ["0201", "0402", "0603", "0805", "1206"]
tolerance = "±0.1%"
resistance = { min = "10Ω", max = "1MΩ" }

[[available]]
size = ["1210", "1218", "2010", "2512"]
tolerance = ["±0.1%", "±0.5%"]
resistance = { min = "10Ω", max = "1MΩ" }

[[available]]
note = "jumper, every size"
resistance = "0Ω"

# Reels per size, Table 4 (p. 7)

[[excluded]]
size = ["1218", "2010", "2512"]
packing = ["reel_7in_paper", "reel_10in_paper", "reel_13in_paper"]

[[excluded]]
size = "01005"
packing = ["reel_10in_paper", "reel_7in_embossed", "reel_13in_embossed"]

[[excluded]]
size = ["0201", "0402", "0603", "0805", "1206", "1210"]
packing = ["reel_7in_embossed", "reel_13in_embossed"]

[[excluded]]
size = ["1218", "2512"]
packing = "reel_13in_embossed"

[[example]]
mpn = "RC0402JR-07100KL"
params = { case_eia = "0402", tolerance = "±5%", packaging = "reel_7in_paper", resistance = "100kΩ", series = "RC_L" }
source = "data sheet p. 2, ordering example"

