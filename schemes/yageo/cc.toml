params = { case_eia = "1210", tolerance = "±10%", packaging = "reel_7in_embossed", dielectric = "X7R", rated_voltage = "50V", capacitance = "10µF" }
source = "Digi-Key listing (mx3 corpus, 10 Nov 2026)"

[[example]]
