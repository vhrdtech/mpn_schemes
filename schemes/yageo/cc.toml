params = { case_eia = "0402", tolerance = "±10%", packaging = "reel_7in_paper", dielectric = "C0G", rated_voltage = "50V", capacitance = "220pF" }
source = "Digi-Key listing (mx3 corpus, 10 Nov 2026)"
