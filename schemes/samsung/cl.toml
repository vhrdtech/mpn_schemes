params = { case_eia = "0402", dielectric = "X7R", capacitance = "100nF", tolerance = "±10%", rated_voltage = "50V", height = "0.5mm", packaging = "reel_7in_paper" }
source = "Digi-Key listing (mx3 corpus, 10 Nov 2026)"

