params = { case_eia = "0402", height = "0.5mm", dielectric = "X7R", rated_voltage = "50V", capacitance = "100nF", tolerance = "±10%", packaging = "reel_13in_paper" }
source = "Digi-Key listing (mx3 corpus, 10 Nov 2026)"

